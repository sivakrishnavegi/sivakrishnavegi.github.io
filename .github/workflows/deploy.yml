name: Deploy Resume to GitHub Pages

on:
  push:
    branches:
      - resume  # Trigger the workflow when there is a push to the 'resume' branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the 'resume' branch
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: resume  # Ensure it's the correct branch

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.18.0'  # Ensure compatibility with Next.js

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build the Next.js app
      - name: Build the Next.js app
        run: npm run build  # Builds the Next.js app

      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}  # Use the Personal Access Token (PAT)
          publish_branch: gh-pages  # Deploy to GitHub Pages branch
          publish_dir: ./out  # Path to the 'out' directory containing the static files
          external_repository: sivakrishnavegi/sivakrishnavegi.github.io

      # Optional: Clean up
      - name: Clean up workspace
        run: rm -rf ./out  # Remove the 'out' directory after deployment
