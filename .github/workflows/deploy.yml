name: Deploy Resume to GitHub Pages

on:
  push:
    branches:
      - resume  # Trigger the workflow when there is a push to the 'resume' branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the 'resume' branch
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: resume  # Make sure it's the correct branch

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.18.0'  # Ensure Node.js version is compatible with Next.js

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build the Next.js app
      - name: Build the Next.js app
        run: npm run build  # Builds the Next.js app (the export is handled automatically by Next.js)

      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.MY_GITHUB_TOKEN }}  # GitHub token for authentication
          publish_dir: ./out  # Path to the 'out' directory containing the static files
          destination_dir: /  # Publish the contents directly to the root of the GitHub Pages branch (gh-pages)

      # Optional: Clean up
      - name: Clean up workspace
        run: rm -rf ./out  # Remove the 'out' directory after deployment
